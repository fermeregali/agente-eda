name: 🧪 CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: 🐍 Configurar Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: 📦 Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 🧪 Executar testes
      run: |
        python test_system.py
    
    - name: 📊 Verificar qualidade do código
      run: |
        pip install flake8
        flake8 main.py --count --select=E9,F63,F7,F82 --show-source --statistics

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: 📦 Configurar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: 📦 Instalar dependências
      run: npm install
    
    - name: 🧪 Executar testes
      run: npm test -- --coverage --watchAll=false
    
    - name: 🏗️ Build do projeto
      run: npm run build

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: 🔒 Verificar vulnerabilidades Python
      run: |
        pip install safety
        safety check -r requirements.txt
    
    - name: 🔒 Verificar vulnerabilidades Node.js
      run: |
        npm audit --audit-level moderate

  deploy:
    needs: [test-backend, test-frontend, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: 🚀 Deploy para produção
      run: |
        echo "Deploy realizado com sucesso!"
        echo "Versão: ${{ github.sha }}"
